<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Meow</title>
    <style>
      :root {
        --bg: #111827;
        --panel: #1f2937;
        --accent: #f472b6;
        --accent-2: #60a5fa;
        --text: #f9fafb;
        --muted: #d1d5db;
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: linear-gradient(135deg, var(--bg), #0f172a);
        color: var(--text);
        font-family: Arial, Helvetica, sans-serif;
      }

      .card {
        width: min(90vw, 700px);
        background: rgba(31, 41, 55, 0.9);
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 20px;
        padding: 48px 32px;
        text-align: center;
        box-shadow: 0 20px 50px rgba(0, 0, 0, 0.35);
      }

      h1 {
        margin: 0 0 18px;
        font-size: clamp(2.2rem, 5vw, 4rem);
      }

      .tag {
        display: inline-block;
        background: rgba(244, 114, 182, 0.12);
        color: var(--accent);
        border: 1px solid rgba(244, 114, 182, 0.4);
        border-radius: 999px;
        padding: 8px 16px;
        font-size: 0.9rem;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        margin-bottom: 20px;
      }

      p {
        margin: 0 auto 24px;
        max-width: 520px;
        color: var(--muted);
        line-height: 1.6;
        font-size: 1.05rem;
      }

      .button-row {
        display: flex;
        justify-content: center;
        gap: 14px;
        flex-wrap: wrap;
      }

      .button {
        text-decoration: none;
        color: var(--text);
        background: linear-gradient(135deg, var(--accent), var(--accent-2));
        border-radius: 999px;
        padding: 12px 22px;
        font-weight: 700;
        transition: transform 0.2s ease;
      }

      .button:hover {
        transform: translateY(-2px);
      }
    </style>
  </head>
  <body>
    <main class="card">
      <div class="tag">GitHub Pages</div>
      <h1>Meow</h1>
      <p>
        This page is deployed from the repository and is set up to be served by GitHub Pages.
      </p>
      <div class="button-row">
        <a class="button" href="https://github.com/jackshinner17/gif9">Repo</a>
      </div>
    </main>
  </body>
</html>
